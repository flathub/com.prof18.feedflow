app-id: com.prof18.feedflow
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
  - org.freedesktop.Sdk.Extension.openjdk25
command: feedflow
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download:rw

modules:
  - name: jbr
    buildsystem: simple
    build-commands:
      - mkdir -p /app/jre
      - tar xzf jbr-*.tar.gz -C /app/jre --strip-components=1
    sources:
      - type: file
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbr-25.0.4.1-linux-x64-b623.69.tar.gz
        sha512: fcc442dcb13aca4358875f7d68819e057a4e045cea845ef188b0caf1b4be2179b8dcf7b6c8cb7d60ecb65275a5b8ee05ba4016f9fdd8d368e53ea629aab0953e
        only-arches:
          - x86_64
      - type: file
        url: https://cache-redirector.jetbrains.com/intellij-jbr/jbr-25.0.4.1-linux-aarch64-b623.69.tar.gz
        sha512: 3fae28e0080bdd8ffaf39f80ca51141dd17adaeb83b955141dc206f3a1d94863a6491f41601921d0590d11d0047741afb9fec424d5fdbfe7b2c294cba9d3f249
        only-arches:
          - aarch64

  - name: feedflow
    buildsystem: simple
    build-options:
      append-path: "/usr/lib/sdk/openjdk21/bin"
    build-commands:
      - ./.scripts/flatpak-build-setup.sh
      - ./.scripts/disable-android-for-flatpak.sh
      - ./gradlew desktopApp:packageReleaseUberJarForCurrentOS --no-daemon --offline -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g" -Dorg.gradle.daemon=true -Dorg.gradle.parallel=false --no-configuration-cache
      - JAR_FILE=$(find desktopApp/build/compose/jars/ -name "*.jar" -type f | head -1) && install -Dm755 "$JAR_FILE" /app/lib/feedflow.jar
      - install -Dm644 desktopApp/packaging/flatpak/com.prof18.feedflow.desktop /app/share/applications/com.prof18.feedflow.desktop
      - install -Dm644 desktopApp/packaging/flatpak/com.prof18.feedflow.metainfo.xml /app/share/metainfo/com.prof18.feedflow.metainfo.xml
      - install -Dm644 desktopApp/packaging/flatpak/com.prof18.feedflow.png /app/share/icons/hicolor/512x512/apps/com.prof18.feedflow.png
      - install -Dm644 desktopApp/packaging/flatpak/com.prof18.feedflow.svg /app/share/icons/hicolor/scalable/apps/com.prof18.feedflow.svg
      - mkdir -p /app/bin
      - install -Dm755 desktopApp/packaging/flatpak/feedflow.sh /app/bin/feedflow
    sources:
      - type: git
        url: https://github.com/prof18/feed-flow
        tag: 1.19.0-all
      - type: file
        url: "https://services.gradle.org/distributions/gradle-9.7.1-bin.zip"
        sha256: "acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a"
        dest: "gradle/wrapper"
        dest-filename: "gradle-bin.zip"
      - flatpak-sources.json
      - flatpak-sources-convention.json
      - flatpak-sources-manual.json
      - flatpak-sources-root.json
